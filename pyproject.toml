[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shinymanager"
version = "0.1.0"
description = "Authentification pour Shiny for Python — portage du package R shinymanager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "shiny>=1.6",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "pyyaml>=6",
    # Icones FontAwesome 6 (py-shiny n'embarque pas font-awesome ; SVG inline).
    "faicons>=0.2",
    # Graphes de l'onglet Logs du panneau admin (remplace billboarder du source R).
    "plotly>=5.20",
    "shinywidgets>=0.3",
]

[project.optional-dependencies]
# Backend Databricks/Spark : dialecte SQLAlchemy (meme voie generique que les autres SGBD).
databricks = ["databricks-sql-connector>=3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/shinymanager"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "RUF"]
# D211/D213 en conflit avec la convention google : laisses au formatter/convention.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tools/*" = ["D"]
"examples/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: test differentiel R->Python (necessite Rscript + le clone source)",
    "spark: test du chemin backend Spark (necessite pyspark)",
    "browser: test comportemental py-shiny (necessite Playwright)",
]
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
branch = true
source = ["src/shinymanager"]
